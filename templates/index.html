<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Channel Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --paper:      #E7E8E2;
    --surface:    #FCFCFA;
    --ink:        #191E24;
    --ink-soft:   #5C656E;
    --ink-faint:  #949CA3;
    --rule:       #D3D5CE;
    --rule-soft:  #E4E5DF;
    --grow:       #2F6F5E;
    --grow-wash:  rgba(47, 111, 94, 0.10);
    --fall:       #9E5139;
    --accent:     #23425A;

    --step-0: 0.8125rem;
    --step-1: 0.9375rem;
    --step-2: 1.0625rem;
    --step-3: 1.5rem;
    --step-4: 2.75rem;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: var(--step-1);
    line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  /* ---- masthead ---- */

  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 4px;
  }

  .masthead h1 {
    margin: 0;
    font-size: var(--step-3);
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .masthead p {
    margin: 0;
    font-size: var(--step-0);
    color: var(--ink-soft);
    max-width: 46ch;
  }

  /* ---- channel rows ---- */

  .channel {
    border-bottom: 1px solid var(--rule);
    padding: 26px 0 22px;
  }

  .channel-top {
    display: grid;
    grid-template-columns: minmax(200px, 300px) 1fr;
    gap: 32px;
    align-items: center;
  }

  .channel-id .name {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .channel-id h2 {
    margin: 0;
    font-size: var(--step-2);
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .source {
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--ink-faint);
  }

  .headline {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .headline .figure {
    font-size: var(--step-4);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
  }

  .delta {
    font-size: var(--step-0);
    font-weight: 600;
  }
  .delta.up   { color: var(--grow); }
  .delta.down { color: var(--fall); }
  .delta.flat { color: var(--ink-faint); }

  .headline-label {
    font-size: var(--step-0);
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .secondary {
    margin-top: 12px;
    font-size: var(--step-0);
    color: var(--ink-soft);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .secondary b {
    color: var(--ink);
    font-weight: 600;
  }

  .plot {
    height: 104px;
    position: relative;
  }

  .plot-empty {
    height: 104px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--rule);
    border-radius: 2px;
    font-size: var(--step-0);
    color: var(--ink-faint);
    text-align: center;
    padding: 0 20px;
  }

  /* ---- disclosures ---- */

  .tools {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 18px;
  }

  button {
    font: inherit;
    font-size: var(--step-0);
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ink-soft); background: var(--surface); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-expanded="true"] { background: var(--surface); border-color: var(--ink-soft); }
  button.go { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }

  .panel {
    display: none;
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--rule-soft);
    border-radius: 2px;
    padding: 18px;
  }
  .panel.open { display: block; }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    align-items: end;
  }

  label {
    display: block;
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  input {
    font: inherit;
    font-size: var(--step-0);
    width: 100%;
    padding: 7px 9px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel-note {
    font-size: var(--step-0);
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  .status {
    font-size: var(--step-0);
    margin-left: 2px;
  }
  .status.ok  { color: var(--grow); }
  .status.err { color: var(--fall); }

  input[type="file"] { display: none; }

  /* ---- tables + log ---- */

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--step-0);
  }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 0 10px 7px 0;
    border-bottom: 1px solid var(--rule);
  }
  td {
    padding: 8px 10px 8px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  td.num, th.num {
    text-align: right;
    padding-right: 0;
    font-feature-settings: 'tnum' 1;
  }
  td.label {
    max-width: 380px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .log { max-height: 240px; overflow-y: auto; }
  .log td { border-bottom: 1px solid var(--rule-soft); }
  .drop {
    font-size: 0.6875rem;
    padding: 2px 7px;
    color: var(--ink-faint);
  }
  .drop:hover { color: var(--fall); border-color: var(--fall); }

  .loading {
    padding: 60px 0;
    color: var(--ink-faint);
    font-size: var(--step-0);
  }

  @media (max-width: 720px) {
    .wrap { padding: 28px 18px 60px; }
    .channel-top { grid-template-columns: 1fr; gap: 18px; }
    :root { --step-4: 2.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div>
      <h1>Channel Desk</h1>
      <p>Where Factiverse's audience is coming from, across four channels.</p>
    </div>
    <p id="dateline"></p>
  </header>

  <main id="channels">
    <p class="loading">Loading channels…</p>
  </main>
</div>

<script>
// ---------------------------------------------------------------------------
// Channel definitions. `flow` metrics are per-day events that get summed over a
// window (impressions). `stock` metrics are running totals where only the
// latest value matters (subscribers).
// ---------------------------------------------------------------------------
const CHANNELS = {
  youtube: {
    name: 'YouTube',
    source: 'updates automatically',
    headline: { label: 'subscribers', kind: 'stock' },
    entry: null
  },
  linkedin: {
    name: 'LinkedIn',
    source: 'from LinkedIn export',
    headline: { field: 'impressions', label: 'impressions in the last 30 days', kind: 'flow' },
    secondary: [
      { field: 'reactions', label: 'reactions', kind: 'flow' },
      { field: 'new_followers', label: 'new followers', kind: 'flow' }
    ],
    entry: [
      { field: 'impressions', label: 'Impressions' },
      { field: 'reactions', label: 'Reactions' },
      { field: 'new_followers', label: 'New followers' }
    ],
    upload: { endpoint: '/api/upload/linkedin', note: 'Page admin → Analytics → Content or Followers → Export. Drop in the .xls files; both at once is fine.' }
  },
  substack: {
    name: 'Substack',
    source: 'from Substack export',
    headline: { field: 'subscribers', label: 'subscribers', kind: 'stock' },
    secondary: [],
    entry: [
      { field: 'subscribers', label: 'Subscribers' },
      { field: 'open_rate', label: 'Open rate %' },
      { field: 'reads', label: 'Reads' }
    ],
    upload: { endpoint: '/api/upload/substack', note: 'Settings → Exports. Drop in the followers and email_stats .csv files.' }
  },
  x: {
    name: 'X',
    source: 'typed in by hand',
    headline: { field: 'impressions', label: 'impressions in the last 30 days', kind: 'flow' },
    secondary: [
      { field: 'likes', label: 'likes', kind: 'flow' },
      { field: 'followers', label: 'followers', kind: 'stock' }
    ],
    entry: [
      { field: 'impressions', label: 'Impressions' },
      { field: 'likes', label: 'Likes' },
      { field: 'followers', label: 'Follower count' }
    ],
    upload: null
  }
};

const ORDER = ['youtube', 'linkedin', 'substack', 'x'];
const charts = {};

// Chart.js draws to canvas and cannot read CSS custom properties, so resolve once.
const CSS = getComputedStyle(document.documentElement);
const INK_FAINT = CSS.getPropertyValue('--ink-faint').trim() || '#949CA3';
const RULE_SOFT = CSS.getPropertyValue('--rule-soft').trim() || '#E4E5DF';
const LINE      = CSS.getPropertyValue('--grow').trim() || '#2F6F5E';

// ---- helpers --------------------------------------------------------------

const num = n => Number(n).toLocaleString('en-GB');

function ascending(entries) {
  return [...entries].reverse();
}

function sumWindow(rows, field, from, to) {
  return rows.slice(from, to).reduce((acc, r) => {
    const v = r.data[field];
    return acc + (typeof v === 'number' ? v : 0);
  }, 0);
}

function latestValue(rows, field) {
  for (const r of rows) {
    const v = r.data[field];
    if (typeof v === 'number') return { value: v, date: r.entry_date };
  }
  return null;
}

function valueAround(rows, field, index) {
  for (let i = index; i < rows.length; i++) {
    const v = rows[i].data[field];
    if (typeof v === 'number') return v;
  }
  return null;
}

function pctChange(now, before) {
  if (before === null || before === undefined || before === 0) return null;
  return ((now - before) / before) * 100;
}

function deltaEl(pct, windowLabel) {
  const el = document.createElement('span');
  if (pct === null || !isFinite(pct)) {
    el.className = 'delta flat';
    el.textContent = '';
    return el;
  }
  const rounded = Math.round(pct);
  if (rounded === 0) {
    el.className = 'delta flat';
    el.textContent = `no change ${windowLabel}`;
  } else {
    el.className = 'delta ' + (rounded > 0 ? 'up' : 'down');
    el.textContent = `${rounded > 0 ? '+' : ''}${rounded}% ${windowLabel}`;
  }
  return el;
}

function drawPlot(canvas, labels, values, color) {
  if (charts[canvas.id]) charts[canvas.id].destroy();
  charts[canvas.id] = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: color,
        backgroundColor: 'rgba(47, 111, 94, 0.10)',
        borderWidth: 1.75,
        fill: true,
        tension: values.length > 10 ? 0.22 : 0,
        pointRadius: values.length > 10 ? 0 : 3,
        pointBackgroundColor: color,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: color,
        spanGaps: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 400 },
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 8, bottom: 0, right: 4 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#191E24',
          titleFont: { family: 'Schibsted Grotesk', size: 11, weight: '500' },
          bodyFont:  { family: 'Schibsted Grotesk', size: 12, weight: '600' },
          padding: 9,
          displayColors: false,
          callbacks: { label: ctx => num(ctx.parsed.y) }
        }
      },
      scales: {
        x: { display: false },
        y: {
          position: 'right',
          border: { display: false },
          grid: { color: RULE_SOFT, drawTicks: false },
          ticks: {
            maxTicksLimit: 3,
            color: INK_FAINT,
            font: { family: 'Schibsted Grotesk', size: 11 },
            padding: 6,
            callback: v => num(v)
          }
        }
      }
    }
  });
}

function disclosure(labelText, buildPanel) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = labelText;
  btn.setAttribute('aria-expanded', 'false');

  const panel = document.createElement('div');
  panel.className = 'panel';
  buildPanel(panel);

  btn.onclick = () => {
    const open = panel.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  };
  return { btn, panel };
}

// ---- rendering ------------------------------------------------------------

async function load() {
  const res = await fetch('/api/data');
  const data = await res.json();
  render(data);
}

function render(data) {
  document.getElementById('dateline').textContent =
    'Updated ' + new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  const main = document.getElementById('channels');
  main.innerHTML = '';
  for (const key of ORDER) {
    main.appendChild(
      key === 'youtube'
        ? renderYouTube(data)
        : renderChannel(key, data.manual[key] || [], data)
    );
  }
}

function channelShell(key) {
  const spec = CHANNELS[key];
  const section = document.createElement('section');
  section.className = 'channel';

  const top = document.createElement('div');
  top.className = 'channel-top';

  const id = document.createElement('div');
  id.className = 'channel-id';
  id.innerHTML = `<div class="name"><h2>${spec.name}</h2><span class="source">${spec.source}</span></div>`;

  const plot = document.createElement('div');

  top.appendChild(id);
  top.appendChild(plot);
  section.appendChild(top);

  return { section, id, plot };
}

function emptyPlot(message) {
  const el = document.createElement('div');
  el.className = 'plot-empty';
  el.textContent = message;
  return el;
}

function addPlot(container, id, labels, values, color) {
  if (typeof Chart === 'undefined') {
    container.appendChild(emptyPlot('Charts could not load. Check your connection and reload.'));
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'plot';
  const canvas = document.createElement('canvas');
  canvas.id = id;
  wrap.appendChild(canvas);
  container.appendChild(wrap);
  requestAnimationFrame(() => drawPlot(canvas, labels, values, color));
}

function renderYouTube(data) {
  const { section, id, plot } = channelShell('youtube');
  const yt = data.youtube;
  const views = data.youtube_views_history || [];

  if (!data.youtube_configured) {
    id.insertAdjacentHTML('beforeend',
      `<p class="headline-label">Add YOUTUBE_API_KEY and YOUTUBE_CHANNEL_ID in Render to switch this on.</p>`);
  } else if (!yt) {
    id.insertAdjacentHTML('beforeend', `<p class="headline-label">No figures pulled yet.</p>`);
  } else {
    const head = document.createElement('div');
    head.className = 'headline';
    head.innerHTML = `<span class="figure">${num(yt.subscriber_count)}</span>`;
    id.appendChild(head);
    id.insertAdjacentHTML('beforeend', `<p class="headline-label">${CHANNELS.youtube.headline.label}</p>`);

    // The 30-day change is a views figure, so it belongs beside views, not
    // beside the subscriber count where it would read as a drop in subscribers.
    const secondary = document.createElement('div');
    secondary.className = 'secondary';

    const viewsBit = document.createElement('span');
    viewsBit.innerHTML = `<b>${num(yt.view_count)}</b> views all time`;
    secondary.appendChild(viewsBit);

    if (views.length >= 60) {
      const recent = views.slice(-30).reduce((a, r) => a + (r.data.views || 0), 0);
      const prior  = views.slice(-60, -30).reduce((a, r) => a + (r.data.views || 0), 0);
      const span = document.createElement('span');
      span.innerHTML = `<b>${num(recent)}</b> views in the last 30 days `;
      span.appendChild(deltaEl(pctChange(recent, prior), 'vs prior 30 days'));
      secondary.appendChild(span);
    }

    const videosBit = document.createElement('span');
    videosBit.innerHTML = `<b>${num(yt.video_count)}</b> videos`;
    secondary.appendChild(videosBit);

    id.appendChild(secondary);
  }

  if (views.length >= 2) {
    addPlot(plot, 'plot-youtube', views.map(v => v.entry_date), views.map(v => v.data.views), LINE);
  } else {
    plot.appendChild(emptyPlot('Import a Studio export to chart daily views.'));
  }

  // tools
  const tools = document.createElement('div');
  tools.className = 'tools';
  const panels = document.createElement('div');

  const refresh = document.createElement('button');
  refresh.type = 'button';
  refresh.className = 'go';
  refresh.textContent = 'Pull latest figures';
  const refreshStatus = document.createElement('span');
  refreshStatus.className = 'status';
  refresh.onclick = async () => {
    refresh.disabled = true;
    refresh.textContent = 'Pulling…';
    refreshStatus.className = 'status';
    refreshStatus.textContent = '';
    try {
      const res = await fetch('/api/refresh-youtube', { method: 'POST' });
      const out = await res.json();
      if (out.error) {
        refreshStatus.className = 'status err';
        refreshStatus.textContent = out.error;
      } else {
        load();
      }
    } catch (e) {
      refreshStatus.className = 'status err';
      refreshStatus.textContent = 'Could not reach the server.';
    }
    refresh.disabled = false;
    refresh.textContent = 'Pull latest figures';
  };
  tools.appendChild(refresh);

  const imp = buildUpload('youtube', '/api/upload/youtube',
    'Studio → Analytics → Advanced mode → Export current view. Drop in Totals.csv and Table_data.csv.');
  tools.appendChild(imp.btn);
  panels.appendChild(imp.panel);

  const top = data.youtube_top_videos;
  if (top && top.length) {
    const d = disclosure('Top videos', panel => {
      panel.innerHTML = `
        <table>
          <thead><tr><th>Video</th><th class="num">Views</th><th class="num">Watch time</th><th class="num">Click rate</th></tr></thead>
          <tbody>${top.slice(0, 6).map(v => `
            <tr>
              <td class="label">${v.title || v.content}</td>
              <td class="num">${num(v.views || 0)}</td>
              <td class="num">${Number(v.watch_time_hours || 0).toFixed(1)}h</td>
              <td class="num">${v.ctr == null ? '—' : v.ctr + '%'}</td>
            </tr>`).join('')}</tbody>
        </table>`;
    });
    tools.appendChild(d.btn);
    panels.appendChild(d.panel);
  }

  tools.appendChild(refreshStatus);
  section.appendChild(tools);
  section.appendChild(panels);
  return section;
}

function renderChannel(key, entries, data) {
  const spec = CHANNELS[key];
  const { section, id, plot } = channelShell(key);
  const rows = entries; // newest first
  const asc = ascending(rows);
  const hf = spec.headline;

  // headline figure
  let figure = null, delta = null;
  if (hf.kind === 'flow') {
    if (rows.length) {
      const recent = sumWindow(rows, hf.field, 0, 30);
      const prior  = sumWindow(rows, hf.field, 30, 60);
      figure = recent;
      delta = rows.length >= 45 ? pctChange(recent, prior) : null;
    }
  } else {
    const latest = latestValue(rows, hf.field);
    if (latest) {
      figure = latest.value;
      const before = valueAround(rows, hf.field, 30);
      delta = before === null ? null : pctChange(latest.value, before);
    }
  }

  if (figure === null) {
    id.insertAdjacentHTML('beforeend',
      `<p class="headline-label">Nothing logged yet. ${spec.upload ? 'Import an export to fill this in.' : 'Add the first numbers below.'}</p>`);
  } else {
    const head = document.createElement('div');
    head.className = 'headline';
    head.innerHTML = `<span class="figure">${num(figure)}</span>`;
    head.appendChild(deltaEl(delta, 'vs prior 30 days'));
    id.appendChild(head);
    id.insertAdjacentHTML('beforeend', `<p class="headline-label">${hf.label}</p>`);

    const secondaryBits = (spec.secondary || []).map(s => {
      const val = s.kind === 'flow' ? sumWindow(rows, s.field, 0, 30) : (latestValue(rows, s.field) || {}).value;
      if (val === undefined || val === null) return null;
      return `<span><b>${num(val)}</b> ${s.label}</span>`;
    }).filter(Boolean);

    if (key === 'substack') {
      const openRate = latestValue(rows, 'open_rate');
      if (openRate) secondaryBits.push(`<span><b>${openRate.value}%</b> open rate, latest post</span>`);
    }
    if (secondaryBits.length) {
      id.insertAdjacentHTML('beforeend', `<div class="secondary">${secondaryBits.join('')}</div>`);
    }
  }

  // plot
  const plotField = hf.field;
  const plottable = asc.filter(r => typeof r.data[plotField] === 'number');
  if (plottable.length >= 2) {
    addPlot(plot, 'plot-' + key,
      plottable.map(r => r.entry_date),
      plottable.map(r => r.data[plotField]),
      LINE);
  } else {
    plot.appendChild(emptyPlot(
      spec.upload
        ? 'Import an export to chart the trend.'
        : 'Log two or more days to chart the trend.'));
  }

  // tools
  const tools = document.createElement('div');
  tools.className = 'tools';
  const panels = document.createElement('div');

  const add = disclosure('Add numbers', panel => {
    panel.innerHTML = `<p class="panel-note">One row per day, taken from ${spec.name}'s own analytics.</p>`;
    const form = document.createElement('form');
    const grid = document.createElement('div');
    grid.className = 'field-grid';
    grid.innerHTML = `
      <div><label for="${key}-date">Date</label><input id="${key}-date" type="date" name="entry_date" required></div>
      ${spec.entry.map(f => `<div><label for="${key}-${f.field}">${f.label}</label><input id="${key}-${f.field}" type="number" step="any" name="${f.field}"></div>`).join('')}`;
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'go';
    submit.textContent = 'Save entry';
    submit.style.marginTop = '12px';
    form.appendChild(grid);
    form.appendChild(submit);
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {};
      for (const [k, v] of fd.entries()) {
        if (v === '') continue;
        payload[k] = k === 'entry_date' ? v : Number(v);
      }
      submit.disabled = true;
      await fetch(`/api/manual/${key}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      form.reset();
      submit.disabled = false;
      load();
    };
    panel.appendChild(form);
  });
  tools.appendChild(add.btn);
  panels.appendChild(add.panel);

  if (spec.upload) {
    const imp = buildUpload(key, spec.upload.endpoint, spec.upload.note);
    tools.appendChild(imp.btn);
    panels.appendChild(imp.panel);
  }

  if (key === 'substack' && data.substack_top_posts && data.substack_top_posts.length) {
    const posts = data.substack_top_posts;
    const d = disclosure('Top posts', panel => {
      panel.innerHTML = `
        <table>
          <thead><tr><th>Post</th><th class="num">Open rate</th><th class="num">Reads</th></tr></thead>
          <tbody>${posts.map(p => `
            <tr>
              <td class="label">${p.data.title || p.entry_date}</td>
              <td class="num">${p.data.open_rate == null ? '—' : p.data.open_rate + '%'}</td>
              <td class="num">${p.data.reads == null ? '—' : num(p.data.reads)}</td>
            </tr>`).join('')}</tbody>
        </table>`;
    });
    tools.appendChild(d.btn);
    panels.appendChild(d.panel);
  }

  if (rows.length) {
    const d = disclosure(`Recent entries (${rows.length})`, panel => {
      const box = document.createElement('div');
      box.className = 'log';
      const table = document.createElement('table');
      table.innerHTML = `<thead><tr><th>Date</th>${spec.entry.map(f => `<th class="num">${f.label}</th>`).join('')}<th></th></tr></thead>`;
      const tbody = document.createElement('tbody');
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.entry_date}</td>` +
          spec.entry.map(f => `<td class="num">${r.data[f.field] == null ? '—' : num(r.data[f.field])}</td>`).join('');
        const cell = document.createElement('td');
        cell.className = 'num';
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'drop';
        del.textContent = 'Remove';
        del.onclick = async () => {
          del.disabled = true;
          await fetch(`/api/manual/${key}/${r.id}`, { method: 'DELETE' });
          load();
        };
        cell.appendChild(del);
        tr.appendChild(cell);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      box.appendChild(table);
      panel.appendChild(box);
    });
    tools.appendChild(d.btn);
    panels.appendChild(d.panel);
  }

  section.appendChild(tools);
  section.appendChild(panels);
  return section;
}

function buildUpload(key, endpoint, note) {
  const { btn, panel } = disclosure('Import file', p => {
    p.innerHTML = `<p class="panel-note">${note}</p>`;

    const pick = document.createElement('button');
    pick.type = 'button';
    pick.className = 'go';
    pick.textContent = 'Choose files';

    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = '.csv,.xls,.xlsx';

    const status = document.createElement('span');
    status.className = 'status';

    pick.onclick = () => input.click();

    input.onchange = async () => {
      if (!input.files.length) return;
      const fd = new FormData();
      for (const f of input.files) fd.append('files', f);

      pick.disabled = true;
      status.className = 'status';
      status.textContent = 'Reading…';

      try {
        const res = await fetch(endpoint, { method: 'POST', body: fd });
        const out = await res.json();
        if (!res.ok || out.error) {
          status.className = 'status err';
          status.textContent = out.error || 'That file could not be read.';
        } else {
          status.className = 'status ok';
          status.textContent = `${out.inserted || 0} days added, ${out.updated || 0} updated.`;
          load();
        }
      } catch (e) {
        status.className = 'status err';
        status.textContent = 'Upload failed. Try again.';
      }
      pick.disabled = false;
      input.value = '';
    };

    p.appendChild(pick);
    p.appendChild(input);
    p.appendChild(status);
  });
  return { btn, panel };
}

load();
</script>

</html>
